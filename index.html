<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>智能在线刷题</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">在线刷题</h1>
      <p class="subtitle" id="quiz-title">加载中...</p>
    </header>

    <!-- 开始页 -->
    <section class="screen screen-start" id="screen-start">
      <div class="start-card">
        <div class="start-icon">📚</div>
        <h2>准备好开始练习了吗？</h2>
        <p class="start-desc">共 <strong id="total-count">0</strong> 道题目，选择答案后查看解析，支持上一题 / 下一题切换。</p>

        <div class="start-stats hidden" id="start-stats">
          <div class="start-stat">
            <span class="start-stat-value" id="stat-answered">0</span>
            <span class="start-stat-label">已练习</span>
          </div>
          <div class="start-stat">
            <span class="start-stat-value stat-wrong" id="stat-wrong">0</span>
            <span class="start-stat-label">错题</span>
          </div>
          <div class="start-stat">
            <span class="start-stat-value stat-rate" id="stat-rate">--</span>
            <span class="start-stat-label">准确率</span>
          </div>
        </div>

        <div class="start-actions">
          <div class="start-actions-row">
            <button class="btn btn-primary btn-action" id="btn-start">开始做题</button>
            <button class="btn btn-danger-outline btn-action" id="btn-clear-progress" type="button" disabled>清除做题记录</button>
          </div>
          <div class="start-actions-row">
            <button class="btn btn-secondary btn-action btn-has-badge" id="btn-wrong-book" type="button">
              错题记录
              <span class="badge badge-inline hidden" id="wrong-count-start">0</span>
            </button>
            <button class="btn btn-danger-outline btn-action" id="btn-clear-wrong-start" type="button" disabled>清除错题记录</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 错题记录 -->
    <section class="screen screen-wrong hidden" id="screen-wrong">
      <div class="wrong-header">
        <h2>错题记录</h2>
        <div class="wrong-header-actions">
          <button class="btn btn-secondary btn-sm" id="btn-back-start" type="button">返回首页</button>
          <button class="btn btn-danger-outline btn-sm" id="btn-clear-wrong" type="button" disabled>一键清空</button>
          <button class="btn btn-primary btn-sm" id="btn-redo-wrong" type="button" disabled>错题重做</button>
        </div>
      </div>
      <div class="wrong-sheet-card hidden" id="wrong-sheet-card">
        <div class="wrong-sheet-top">
          <span class="wrong-sheet-title">答题卡</span>
          <div class="wrong-sheet-legend">
            <span class="legend-item"><i class="legend-dot legend-wrong"></i>错误</span>
          </div>
        </div>
        <div class="wrong-grid" id="wrong-list"></div>
      </div>
      <p class="wrong-empty hidden" id="wrong-empty">暂无错题，继续加油！</p>
    </section>

    <!-- 做题页 -->
    <section class="screen screen-quiz hidden" id="screen-quiz">
      <div class="quiz-toolbar">
        <button class="btn btn-secondary btn-toolbar" id="btn-back-home-quiz" type="button">返回首页</button>
        <button class="btn btn-secondary btn-toolbar btn-has-badge" id="btn-wrong-book-quiz" type="button">
          错题记录
          <span class="badge badge-inline hidden" id="wrong-count-quiz">0</span>
        </button>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-status">
        <span class="progress-prefix">第</span>
        <span class="progress-current-num" id="current-num">1</span>
        <span class="progress-suffix">/ <span id="total-num">0</span> 题</span>
      </div>

      <div class="question-card">
        <div class="question-type">单选题</div>
        <h2 class="question-text" id="question-text"></h2>

        <ul class="options" id="options-list"></ul>

        <div class="answer-panel" id="answer-panel">
          <div class="answer-result" id="answer-result"></div>
          <div class="answer-explanation" id="answer-explanation"></div>
        </div>
      </div>

      <div class="nav-bar">
        <button class="btn btn-secondary" id="btn-prev" disabled>上一题</button>
        <button class="btn btn-secondary" id="btn-next">下一题</button>
      </div>

      <div class="answer-sheet-card" id="answer-sheet-card">
        <button class="answer-sheet-toggle" id="answer-sheet-toggle" type="button">
          <span class="answer-sheet-title">答题卡</span>
          <div class="answer-sheet-legend">
            <span class="legend-item"><i class="legend-dot legend-unanswered"></i>未答</span>
            <span class="legend-item"><i class="legend-dot legend-correct"></i>正确</span>
            <span class="legend-item"><i class="legend-dot legend-wrong"></i>错误</span>
          </div>
          <span class="answer-sheet-arrow" aria-hidden="true">▼</span>
        </button>
        <div class="answer-sheet-body hidden" id="answer-sheet-body">
          <div class="answer-sheet-grid" id="answer-sheet-grid"></div>
        </div>
      </div>
    </section>

    <!-- 加载失败 -->
    <section class="screen screen-error hidden" id="screen-error">
      <div class="error-card">
        <div class="error-icon">⚠️</div>
        <h2>题库加载失败</h2>
        <p id="error-message">请确认 data/questions.json 文件存在且格式正确。</p>
        <p class="error-hint">可将 PDF 放入 source/ 目录，运行 <code>python scripts/pdf_to_questions.py</code> 生成题库。</p>
      </div>
    </section>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
